quarkus.application.name=producer-service
quarkus.swagger-ui.always-include=true

kafka.bootstrap.servers=kafka.kafka-demo.svc.cluster.local:9092

mp.messaging.outgoing.davalar.connector=smallrye-kafka
mp.messaging.outgoing.davalar.topic=davalar
mp.messaging.outgoing.davalar.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Lokal "quarkus dev" calistirirken cluster DNS'i cozulmedigi icin
# kubectl port-forward ile acilan localhost:9095 (LOCALHOST listener) kullanilir.
%dev.kafka.bootstrap.servers=localhost:9095
# 8080 host'ta docker-compose'daki kafka-ui tarafindan kullaniliyor, catisma olmasin diye.
%dev.quarkus.http.port=8082
