quarkus.application.name=consumer-service
quarkus.swagger-ui.always-include=true

kafka.bootstrap.servers=kafka.kafka-demo.svc.cluster.local:9092

mp.messaging.incoming.davalar.connector=smallrye-kafka
mp.messaging.incoming.davalar.topic=davalar
mp.messaging.incoming.davalar.group.id=consumer-service
mp.messaging.incoming.davalar.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.davalar.auto.offset.reset=earliest

# Lokal "quarkus dev" calistirirken cluster DNS'i cozulmedigi icin
# kubectl port-forward ile acilan localhost:9095 (LOCALHOST listener) kullanilir.
%dev.kafka.bootstrap.servers=localhost:9095
# producer-service ile ayni anda lokalde calisirken 8080 catismasin diye.
%dev.quarkus.http.port=8081
