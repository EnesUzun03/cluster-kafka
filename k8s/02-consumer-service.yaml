apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-service
  namespace: kafka-demo
  labels:
    app: consumer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-service
  template:
    metadata:
      labels:
        app: consumer-service
    spec:
      containers:
        - name: consumer-service
          image: consumer-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-service
  namespace: kafka-demo
spec:
  selector:
    app: consumer-service
  ports:
    - port: 8080
      targetPort: 8080
